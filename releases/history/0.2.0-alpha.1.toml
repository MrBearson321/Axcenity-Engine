version = "0.2.0-alpha.1"
date = "2026-11-11"
title = "Multiplayer, Luau scripting and an editor that updates itself"
summary = """
The first Development build since 0.1.0-alpha.3: multiplayer with a
dedicated server, Luau scripting, Model Studio, the UI Designer, a large
rendering, physics and gameplay update, faster editing and loading, and an
editor that checks for, installs and rolls back its own updates. An alpha
for people following Development: projects open in it are upgraded to
project format 5 after asking, and older engines can't open them again.
"""
evidence = "verified"
published = true

[verification]
linux = "scripts/check-platform.sh on 9a8a0f2d (cloud, no GPU or sound): build, clippy, doc tests, server headless pass; all tests pass except the audio tutorial sample (no sound device) and a release test fixed in this PR; game test fixed in this PR and passes."
windows = "scripts/check-platform.ps1 and check-packages.py --profile release on 9a8a0f2d (a Windows 11 desktop): build, clippy, doc tests, server, installer, Build Game and the built game pass. Fixed before the tag: the --mcp stack overflow (#178), the release test and the game test command. Test-only: Team Create temp folder names (#180); luau-lsp 1.70 wording."

[formats]
axgame = 2
network_protocol = 11
project = 5
save = 2
world = 2

