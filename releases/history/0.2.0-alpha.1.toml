[[changes]]
category = "feature"
subsystem = "release"
title = "Help > Version Explorer shows every release, feature and known issue, and compares two versions"
details = "It works offline from the release history built into the editor. Help > About's Copy diagnostics copies the build, system, GPU and the known issues of your version for a bug report."
features = ["release.version-explorer"]

[[changes]]
category = "feature"
subsystem = "release"
title = "The editor tells you when a new version is out on your update channel"
details = "Settings > Updates: follow Stable, Beta or Development, check every day, every week or only by hand. Official builds only; a check asks GitHub for its release list and verifies the release's signed manifest before saying anything."
features = ["release.update-checks"]

[[changes]]
category = "feature"
subsystem = "release"
title = "The editor downloads and installs updates itself, and can roll back"
details = "Settings > Updates on the Windows setup and the Linux tar.gz: Download and install (resumable, checked against the signed manifest's size and SHA-256), then Restart and install. A small axcenity-updater swaps the install folder after the editor closes, checks the new version runs and puts the old one back if it doesn't; Roll back returns to the version it replaced. Projects, settings and other user files are never touched. Other installs are told how to update."
features = ["release.updater"]

[[changes]]
category = "breaking"
subsystem = "project"
title = "The editor asks before upgrading an older project, and projects record which Axcenity saved them"
details = "Projects are now format 5: the manifest records the Axcenity version that made and last saved the project. Opening an older project shows what the upgrade changes and where the files from before are kept, and nothing is written until you choose Upgrade; if the upgraded world won't load, the old files are put back. A project from a newer Axcenity is refused with the version to update to. What breaks: an older Axcenity can't open a project once this version has upgraded or saved it. To go back, open the copy kept in .axcenity/previous/4 with the older version."
features = ["project.format-migration"]
