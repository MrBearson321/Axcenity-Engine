# The project subsystem's features. Format: releases/README.md.

[[feature]]
id = "project.format-migration"
name = "Project format upgrades"
subsystem = "project"
description = "Older projects are upgraded to the current format after you agree, keeping a copy of the previous files and putting it back if the upgrade doesn't load; newer ones are refused with the version they need."
status = "active"
docs = "docs/project/world.md"
[feature.introduced]
version = "0.1.0-alpha.3"
evidence = "verified"
source = "crates/project/src/migrate.rs in the tree at tag v0.1.0-alpha.3"

[[feature]]
id = "project.version-history"
name = "Version History"
subsystem = "project"
description = "A project's saved checkpoints, to look back and restore."
status = "active"
docs = "docs/project/export.md"
[feature.introduced]
version = "0.1.0-alpha.3"
evidence = "verified"
source = "crates/project/src/versions.rs in the tree at tag v0.1.0-alpha.3"

