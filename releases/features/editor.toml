# The editor subsystem's features. Format: releases/README.md.

[[feature]]
id = "editor.explorer"
name = "Explorer"
subsystem = "editor"
description = "The tree of Instances: select, rename, reparent and filter."
status = "active"
docs = "docs/editor/tree.md"
[feature.introduced]
version = "0.1.0-alpha.3"
evidence = "verified"
source = "crates/editor/src/explorer.rs in the tree at tag v0.1.0-alpha.3"

