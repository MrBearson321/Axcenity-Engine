# The release subsystem's features. Format: releases/README.md.

[[feature]]
id = "release.version-info"
name = "Version and build information"
subsystem = "release"
description = "--version on every program; the About box shows the version, channel and commit."
status = "active"
docs = "docs/project/releases.md"
[feature.introduced]
version = "unreleased"
evidence = "verified"
source = "this change: crates/release"

[[feature]]
id = "release.version-explorer"
name = "Version Explorer"
subsystem = "release"
description = "Help > Version Explorer: the releases, features, known issues and what changed between two versions, offline."
status = "active"
docs = "docs/editor/shell.md"
[feature.introduced]
version = "unreleased"
evidence = "verified"
source = "this change: crates/editor/src/version_explorer.rs"

[[feature]]
id = "release.update-checks"
name = "Update checks"
subsystem = "release"
description = "Settings > Updates: an update channel, daily or weekly checks of GitHub releases, and a verified, signed manifest before an update is shown."
status = "active"
docs = "docs/editor/shell.md"
[feature.introduced]
version = "unreleased"
evidence = "verified"
source = "this change: crates/release/src/updates.rs, crates/editor/src/app/updates.rs"

[[feature]]
id = "release.updater"
name = "Updater"
subsystem = "release"
description = "Download and install from Settings > Updates on the Windows setup and the Linux tar.gz: a verified, resumable download, a folder swap after the editor closes, a check that the new version runs, automatic and by-hand roll back."
status = "active"
docs = "docs/editor/shell.md"
[feature.introduced]
version = "unreleased"
evidence = "verified"
source = "this change: crates/updater, crates/editor/src/app/update_install.rs"
