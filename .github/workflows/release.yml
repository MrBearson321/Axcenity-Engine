name: Release

# Runs only for a release tag, or by hand: never on pushes or pull requests.
# A tag run checks everything cheap on Linux first, then builds, packages,
# signs and ends in a DRAFT release that a person publishes. Nothing here
# publishes on its own. How to cut a release: docs/project/releases.md.
#
# No build cache, on purpose: a cache saved by one tag can't be restored by
# the next (caches are per ref), and a run started by hand runs in main's
# context while building a tag, where saving a cache would let that code
# feed later runs. Releases are rare and the runners are free, so every
# release builds from scratch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only check the release files and the signing key (about two Linux minutes)"
        type: boolean
        default: true
      tag:
        description: "Tag to build again, such as v0.2.0-alpha.1 (needed when dry run is off)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  NFPM_VERSION: "2.48.0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.mode.outputs.full }}
      ref: ${{ steps.mode.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      profile: ${{ steps.plan.outputs.profile }}
      commit: ${{ steps.plan.outputs.commit }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
    steps:
      - name: Decide what this run does
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"; full=true
          elif [ "$DRY_RUN" = "true" ]; then
            tag="$INPUT_TAG"; full=false
          else
            if [ -z "$INPUT_TAG" ]; then
              echo "::error::Turn dry run on, or give the tag to build"
              exit 1
            fi
            tag="$INPUT_TAG"; full=true
          fi
          if [ -n "$tag" ]; then ref="refs/tags/$tag"; else ref="$GITHUB_REF"; fi
          {
            echo "tag=$tag"
            echo "full=$full"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Full release run: $full; tag: ${tag:-none}; ref: $ref"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.mode.outputs.ref }}
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Check releases/, Cargo.toml and the tag
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            cargo run -q --locked -p axcenity-release -- check --tag "$TAG"
          else
            cargo run -q --locked -p axcenity-release -- check
          fi
      - name: Release tool tests
        run: cargo test -q --locked -p axcenity-release
      - name: Plan
        id: plan
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG="v$(cargo run -q --locked -p axcenity-release -- --version --json | jq -r .version)"
          fi
          plan="$(cargo run -q --locked -p axcenity-release -- plan --tag "$TAG")"
          echo "$plan" | jq .
          {
            echo "tag=$(echo "$plan" | jq -r .tag)"
            echo "version=$(echo "$plan" | jq -r .version)"
            echo "channel=$(echo "$plan" | jq -r .channel)"
            echo "prerelease=$(echo "$plan" | jq -r .prerelease)"
            echo "profile=$(echo "$plan" | jq -r .profile)"
            echo "commit=$(git rev-parse HEAD)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$(echo "$plan" | jq -r .tag)\` |"
            echo "| Channel | $(echo "$plan" | jq -r .channel) |"
            echo "| Profile | \`$(echo "$plan" | jq -r .profile)\` |"
            echo "| Platforms | $(echo "$plan" | jq -r '.platforms | join(", ")') |"
            echo "| Full run | ${{ steps.mode.outputs.full }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The tag isn't already a published release
        if: steps.mode.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already a published release; published releases never change. Release a new version instead."
              exit 1
            fi
            echo "$TAG has a draft release; this run replaces its files."
          fi
      - name: The release signing key's public half is committed
        if: steps.mode.outputs.full == 'true'
        run: |
          if [ ! -f packaging/axcenity-release.pub ]; then
            echo "::error::packaging/axcenity-release.pub is missing: create the signing key first (docs/project/releases.md, \"Signing key\")"
            exit 1
          fi

  # A dry run's check that the signing key works: signs a scratch file with
  # the secret key and verifies it with the committed public key. Uses the
  # `release` environment, like the real signing step.
  signing-check:
    name: Signing key check
    needs: validate
    if: needs.validate.outputs.full != 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - name: Install minisign
        run: sudo apt-get update -q && sudo apt-get install -y -q minisign
      - name: Sign and verify a scratch file
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ ! -f packaging/axcenity-release.pub ]; then
            echo "::warning::The signing key isn't set up yet (the MINISIGN_SECRET_KEY secret and packaging/axcenity-release.pub). A tag run would stop before building."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          echo "signing check $(date -u +%FT%TZ)" > "$RUNNER_TEMP/check.txt"
          minisign -S -s "$key" -m "$RUNNER_TEMP/check.txt" -t "axcenity-engine signing check"
          rm -f "$key"
          minisign -V -m "$RUNNER_TEMP/check.txt" -p packaging/axcenity-release.pub
          echo "The signing key matches packaging/axcenity-release.pub."

  build:
    name: Build (${{ matrix.host }})
    needs: validate
    if: needs.validate.outputs.full == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            host: windows
          - os: macos-latest
            host: macos
          - os: ubuntu-22.04
            host: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PROFILE: ${{ needs.validate.outputs.profile }}
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      # Official build provenance (crates/release/build.rs).
      AXCENITY_OFFICIAL_BUILD: "1"
      AXCENITY_BUILD_TAG: ${{ needs.validate.outputs.tag }}
      AXCENITY_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@1.97.0
        if: matrix.host != 'macos'
      - uses: dtolnay/rust-toolchain@1.97.0
        if: matrix.host == 'macos'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Linux audio libraries
        if: matrix.host == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libudev-dev pkg-config
      - name: Build
        if: matrix.host != 'macos'
        run: |
          set -euo pipefail
          cargo build --profile "$PROFILE" --locked -p axcenity-editor -p axcenity-player
          mkdir -p dist-bin
          ext=""; if [ "${{ matrix.host }}" = "windows" ]; then ext=".exe"; fi
          for bin in axcenity-editor axcenity-player; do
            cp "target/$PROFILE/$bin$ext" "dist-bin/$bin$ext"
          done
      - name: Build macOS universal binaries
        if: matrix.host == 'macos'
        run: |
          set -euo pipefail
          cargo build --profile "$PROFILE" --locked -p axcenity-editor -p axcenity-player --target aarch64-apple-darwin
          cargo build --profile "$PROFILE" --locked -p axcenity-editor -p axcenity-player --target x86_64-apple-darwin
          mkdir -p dist-bin
          for bin in axcenity-editor axcenity-player; do
            lipo -create -output "dist-bin/$bin" \
              "target/aarch64-apple-darwin/$PROFILE/$bin" \
              "target/x86_64-apple-darwin/$PROFILE/$bin"
          done
      - name: Smoke test, the binaries say what they are
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" scripts/check-release-build.py --profile="$PROFILE" "$VERSION" "$COMMIT" dist-bin/*
          mkdir -p runner
          echo "$ImageOS $ImageVersion" > runner/image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.host }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.host }}
          path: runner/image.txt
          retention-days: 7

  package-windows:
    name: Package Windows
    needs: [validate, build]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: ci-bins
      - name: Install NSIS and Pillow
        shell: powershell
        run: |
          choco install nsis -y
          python -m pip install --upgrade pillow
      - name: Stage payload and update archive
        run: |
          set -euo pipefail
          python packaging/generate-assets.py
          python packaging/stage.py \
            --os windows \
            --editor ci-bins/bin-windows/axcenity-editor.exe \
            --player-native ci-bins/bin-windows/axcenity-player.exe \
            --player-windows ci-bins/bin-windows/axcenity-player.exe \
            --player-macos ci-bins/bin-macos/axcenity-player \
            --player-linux ci-bins/bin-linux/axcenity-player \
            --out dist/stage
          python packaging/update-zip.py dist/stage "dist/out/AxcenityEditor-${VERSION}-windows-x86_64-update.zip"
      - name: Build NSIS installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "makensis not found at $nsis" }
          $outDir = Join-Path $root "dist\out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $out = Join-Path $outDir "AxcenityEditor-$($env:VERSION)-windows-x86_64.exe"
          # Git Bash converts /D... into paths; this step is PowerShell so NSIS sees real defines.
          & $nsis `
            "/DVERSION=$($env:VERSION)" `
            "/DSTAGE=$(Join-Path $root 'dist\stage')" `
            "/DOUTFILE=$out" `
            "/DICON=$(Join-Path $root 'assets\branding\icon.ico')" `
            "/DHEADER=$(Join-Path $root 'packaging\assets\nsis-header.bmp')" `
            "/DSIDEBAR=$(Join-Path $root 'packaging\assets\nsis-sidebar.bmp')" `
            (Join-Path $root "packaging\windows\installer.nsi")
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Get-ChildItem $outDir
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/out/AxcenityEditor-*
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: Package macOS
    needs: [validate, build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: ci-bins
      - name: Stage and build disk image
        run: |
          set -euo pipefail
          chmod +x ci-bins/bin-*/axcenity-* || true
          python3 -m pip install --upgrade pillow
          python3 packaging/generate-assets.py
          python3 packaging/stage.py \
            --os macos \
            --editor ci-bins/bin-macos/axcenity-editor \
            --player-native ci-bins/bin-macos/axcenity-player \
            --player-windows ci-bins/bin-windows/axcenity-player.exe \
            --player-macos ci-bins/bin-macos/axcenity-player \
            --player-linux ci-bins/bin-linux/axcenity-player \
            --out dist/stage
          mkdir -p dist/out
          bash packaging/macos/build-dmg.sh \
            "$VERSION" \
            "$PWD" \
            "$PWD/dist/stage" \
            "$PWD/dist/out/AxcenityEditor-${VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/out/*.dmg
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: Package Linux
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: ci-bins
      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext-base zstd file libfuse2
          python3 -m pip install --upgrade pillow
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          sudo curl -sSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool /usr/local/bin/nfpm
      - name: Stage and build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          python3 packaging/stage.py \
            --os linux \
            --editor ci-bins/bin-linux/axcenity-editor \
            --player-native ci-bins/bin-linux/axcenity-player \
            --player-windows ci-bins/bin-windows/axcenity-player.exe \
            --player-macos ci-bins/bin-macos/axcenity-player \
            --player-linux ci-bins/bin-linux/axcenity-player \
            --out dist/stage
          bash packaging/linux/build-packages.sh \
            "$VERSION" \
            "$PWD" \
            "$PWD/dist/stage" \
            "$PWD/dist/out"
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            dist/out/*.deb
            dist/out/*.rpm
            dist/out/*.pkg.tar.zst
            dist/out/*.tar.gz
            dist/out/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # Signs the manifest and creates the DRAFT release. The `release`
  # environment holds the signing key; give it a required reviewer so this
  # job waits for a person's approval before it runs.
  draft:
    name: Sign and draft the release
    needs: [validate, package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install minisign
        run: sudo apt-get update -q && sudo apt-get install -y -q minisign
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-*
          path: runners
      - name: History, manifest and notes
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          PROFILE: ${{ needs.validate.outputs.profile }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          release() { cargo run -q --locked -p axcenity-release -- "$@"; }
          release history --out dist/axcenity-history.json
          release manifest "$VERSION" --dist dist --out dist/axcenity-release.json \
            --commit "$COMMIT" \
            --published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --workflow-run "$RUN_URL" \
            --rustc "$(rustc --version | cut -d' ' -f2)" \
            --profile "$PROFILE" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --runner-image "windows-x86_64=$(cat runners/runner-windows/image.txt)" \
            --runner-image "linux-x86_64=$(cat runners/runner-linux/image.txt)" \
            --runner-image "macos-universal=$(cat runners/runner-macos/image.txt)"
          mkdir -p meta
          release notes "$VERSION" --install packaging/release-notes.md.tpl --out meta/notes.md
          jq -r .title dist/axcenity-release.json > meta/title.txt
      - name: Sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret isn't set in the release environment"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/axcenity-release.json -t "axcenity-engine $TAG"
          rm -f "$key"
          minisign -V -m dist/axcenity-release.json -p packaging/axcenity-release.pub
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Axcenity Engine $VERSION: $(cat meta/title.txt)"
          extra=()
          if [ "$PRERELEASE" = "true" ]; then extra+=(--prerelease); fi
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG was published while this run was building; nothing changed"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file meta/notes.md "${extra[@]}"
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "$title" --notes-file meta/notes.md "${extra[@]}"
          fi
          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### Draft release ready"
            echo
            echo "$url"
            echo
            echo "Nobody sees it until a person publishes it on GitHub."
          } >> "$GITHUB_STEP_SUMMARY"
