[package]
name = "axcenity-testing"
description = "The Axcenity Engine's game test runner: spec files run against a headless copy of a game."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# `cargo run -p axcenity-testing` runs the game test runner, not bench-check.
default-run = "axcenity-test"

[[bin]]
name = "axcenity-test"
path = "src/main.rs"

# Runs benchmarks/baselines.json's scenes and compares them with this
# machine's recorded numbers (docs/benchmarks.md, "Regression check").
[[bin]]
name = "axcenity-bench-check"
path = "src/bench_check.rs"

[dependencies]
axcenity-assets.workspace = true
axcenity-character.workspace = true
axcenity-core.workspace = true
axcenity-project.workspace = true
axcenity-script.workspace = true
axcenity-sim.workspace = true
profiling.workspace = true
serde_json.workspace = true
axcenity-workspace-hack.workspace = true

[features]
# Sends profiler spans to Tracy (roadmap I1): `--features profile-tracy`.
profile-tracy = ["profiling/profile-with-tracy"]

[lints]
workspace = true
