[package]
name = "axcenity-assets"
description = "Axcenity assets: loads the files a project uses, such as glTF and FBX models, and imports new ones."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Plain data out: no renderer, physics or UI crates, so `physics` and `scene`
# can both read the same loaded models.
[dependencies]
glam.workspace = true
gltf.workspace = true
image.workspace = true
meshopt.workspace = true
serde.workspace = true
serde_json.workspace = true
texture2ddecoder.workspace = true
thiserror.workspace = true
ufbx.workspace = true
axcenity-workspace-hack.workspace = true

[lints]
workspace = true
