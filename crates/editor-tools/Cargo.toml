[package]
name = "axcenity-editor-tools"
description = "The Axcenity editor's viewport tools (the transform gizmo, snapping, the shortcut table, the posing preview) and the small editor types its panel crates share."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axcenity-anim.workspace = true
axcenity-assets.workspace = true
axcenity-character.workspace = true
axcenity-core.workspace = true
axcenity-editor-kit.workspace = true
axcenity-render.workspace = true
axcenity-scene.workspace = true
eframe.workspace = true
log.workspace = true
axcenity-workspace-hack.workspace = true

[features]
# Test helpers (gizmo drags without a window, snapping boxes, the shortcut
# clash checks) for the editor's and the studios' tests. Turn it on from
# `[dev-dependencies]` only.
test-support = []

[dev-dependencies]
# The built-in props' prefabs, read in `props.rs`'s tests.
axcenity-project.workspace = true
axcenity-editor-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
