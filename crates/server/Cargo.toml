[package]
name = "axcenity-server"
description = "The Axcenity dedicated server: runs a game's Scripts headless (no window, audio or GPU) and hosts it on the network."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "axcenity-server"
path = "src/main.rs"

# Headless players for scale and soak tests (multiplayer readiness MP1).
[[bin]]
name = "axcenity-bots"
path = "src/bots/main.rs"

[dependencies]
axcenity-assets.workspace = true
axcenity-character.workspace = true
axcenity-core.workspace = true
axcenity-net.workspace = true
axcenity-project.workspace = true
axcenity-release.workspace = true
axcenity-save.workspace = true
axcenity-script.workspace = true
axcenity-sim.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
profiling.workspace = true
serde_json.workspace = true
axcenity-workspace-hack.workspace = true

[dev-dependencies]
# An in-process relay for `tests/relay.rs` (MP5).
axcenity-relay.workspace = true

[features]
# Sends profiler spans to Tracy (roadmap I1): `--features profile-tracy`.
profile-tracy = ["profiling/profile-with-tracy"]

[lints]
workspace = true
