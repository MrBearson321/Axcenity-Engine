[package]
name = "axcenity-render"
description = "The Axcenity renderer: draws a draw list with wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# No engine crates here, on purpose: `render` only knows about draw lists.
[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
glyphon.workspace = true
glam.workspace = true
log.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
wgpu.workspace = true
axcenity-workspace-hack.workspace = true

[features]
# The editor's debug views (`TextureRenderer::set_debug_view`: wireframe,
# normals, overdraw and the rest). The player leaves them out.
debug-views = []

[dev-dependencies]
# GPU tests set up a device without a window.
pollster.workspace = true
serde_json.workspace = true

[lints]
workspace = true
