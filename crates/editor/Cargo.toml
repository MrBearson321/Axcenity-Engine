[package]
name = "axcenity-editor"
description = "The Axcenity Engine editor: open a project, edit its world, save, and play it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axcenity-anim.workspace = true
axcenity-assets.workspace = true
axcenity-audio.workspace = true
axcenity-blocks.workspace = true
axcenity-character.workspace = true
axcenity-core.workspace = true
axcenity-nav.workspace = true
axcenity-physics.workspace = true
axcenity-project.workspace = true
axcenity-render.workspace = true
axcenity-save.workspace = true
axcenity-scene.workspace = true
axcenity-script.workspace = true
axcenity-terrain.workspace = true
axcenity-ui.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui-phosphor.workspace = true
egui_dock.workspace = true
env_logger.workspace = true
log.workspace = true
memory-stats.workspace = true
image.workspace = true
png.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
zip.workspace = true
dioxus-cli-config = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }
subsecond = { workspace = true, optional = true }

[features]
# Development only: patch changed function bodies into the running editor
# when it's started with `dx serve --hot-patch` (see the README). Started
# normally, or without this feature, engine edits rebuild and relaunch.
hot-patch = ["dep:dioxus-cli-config", "dep:dioxus-devtools", "dep:subsecond"]

[dev-dependencies]
# Draws editor UI offscreen in tests (see `snapshot.rs`).
pollster.workspace = true

[lints]
workspace = true
