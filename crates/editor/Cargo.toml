[package]
name = "axcenity-editor"
description = "The Axcenity Engine editor: open a project, edit its world, save, and play it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axcenity-anim.workspace = true
axcenity-assets.workspace = true
axcenity-cook.workspace = true
axcenity-audio.workspace = true
axcenity-blocks.workspace = true
axcenity-character.workspace = true
axcenity-collab.workspace = true
axcenity-core.workspace = true
axcenity-editor-benchmark.workspace = true
axcenity-editor-kit.workspace = true
axcenity-editor-model-studio.workspace = true
axcenity-editor-node-graph.workspace = true
axcenity-editor-toolbox.workspace = true
axcenity-editor-tools.workspace = true
axcenity-editor-ui-designer.workspace = true
axcenity-gameplay.workspace = true
axcenity-mcp.workspace = true
axcenity-mesh-edit.workspace = true
axcenity-nav.workspace = true
axcenity-physics.workspace = true
axcenity-plugins.workspace = true
axcenity-procedural.workspace = true
axcenity-project.workspace = true
axcenity-repo.workspace = true
axcenity-release.workspace = true
# Its debug views (View > View Mode) are the editor's only; the player leaves them out.
axcenity-render = { workspace = true, features = ["debug-views"] }
axcenity-save.workspace = true
axcenity-scene.workspace = true
axcenity-net.workspace = true
axcenity-script.workspace = true
axcenity-sim.workspace = true
axcenity-terrain.workspace = true
axcenity-testing.workspace = true
axcenity-toolbox.workspace = true
# Downloading, staging and handing over updates (Settings > Updates).
axcenity-updater = { workspace = true, features = ["http"] }
axcenity-ui.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui_dock.workspace = true
env_logger.workspace = true
log.workspace = true
memory-stats.workspace = true
image.workspace = true
png.workspace = true
rayon.workspace = true
regex.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
profiling.workspace = true
axcenity-workspace-hack.workspace = true

[features]
# Sends profiler spans to Tracy (roadmap I1): `--features profile-tracy`.
profile-tracy = ["profiling/profile-with-tracy"]
# For whoever works on the engine (unified Phase 89): the editor watches
# `crates/`, rebuilds itself in the background and relaunches with the
# session (Settings > Engine). Creators' and release editors have none of it.
engine-dev = []

[dev-dependencies]
# `theme::test_context`, `theme::run` and `snapshot` for drawing tests.
axcenity-editor-kit = { workspace = true, features = ["test-support"] }
# `graphics_benchmark::testing::quick_report` for the benchmark window's tests.
axcenity-editor-benchmark = { workspace = true, features = ["test-support"] }
# Model Studio docs (a cube, a chair, a rigged humanoid) for the editor's tests.
axcenity-editor-model-studio = { workspace = true, features = ["test-support"] }
# The UI Designer's inspector sections and drags for the editor's tests.
axcenity-editor-ui-designer = { workspace = true, features = ["test-support"] }
# Gizmo drags, snapping boxes and shortcut checks for the editor's tests.
axcenity-editor-tools = { workspace = true, features = ["test-support"] }
# Draws editor UI offscreen in tests (see `snapshot.rs`).
pollster.workspace = true
# Builds update archives for the install tests (`app/update_install.rs`).
flate2.workspace = true
tar.workspace = true

[lints]
workspace = true
