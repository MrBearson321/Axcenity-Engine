[package]
name = "axcenity-script"
description = "Runs Axcenity Lua scripts against the Instance tree."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axcenity-anim.workspace = true
axcenity-assets.workspace = true
axcenity-character.workspace = true
axcenity-core.workspace = true
axcenity-mesh-edit = { workspace = true, optional = true }
axcenity-physics.workspace = true
axcenity-procedural.workspace = true
axcenity-render-types.workspace = true
axcenity-save.workspace = true
glam.workspace = true
mlua.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
profiling.workspace = true
axcenity-workspace-hack.workspace = true

[features]
default = ["csg"]
# `part:UnionAsync` and friends, by `mesh_edit`'s booleans. Without it the
# methods raise an error, and `mesh_edit` isn't built (roadmap M8).
csg = ["dep:axcenity-mesh-edit"]

# Only pins the Luau version `mlua` builds (see the workspace Cargo.toml).
[build-dependencies]
luau0-src.workspace = true

[lints]
workspace = true
