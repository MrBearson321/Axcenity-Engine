[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Paul Janota and contributors"]

# Every third-party dependency is declared here, once, with a pinned major version.
# Crates opt in with `name.workspace = true`. Upgrade deliberately, never by accident.
[workspace.dependencies]
# Engine crates. In code they're named with underscores, for example `axcenity_core`.
axcenity-anim = { path = "crates/anim" }
axcenity-assets = { path = "crates/assets" }
axcenity-audio = { path = "crates/audio" }
axcenity-blocks = { path = "crates/blocks" }
axcenity-blocks-runtime = { path = "crates/blocks-runtime" }
axcenity-character = { path = "crates/character" }
axcenity-cook = { path = "crates/cook" }
axcenity-core = { path = "crates/core" }
axcenity-gameplay = { path = "crates/gameplay" }
axcenity-mesh-edit = { path = "crates/mesh_edit" }
axcenity-nav = { path = "crates/nav" }
axcenity-net = { path = "crates/net" }
axcenity-physics = { path = "crates/physics" }
axcenity-plugins = { path = "crates/plugins" }
axcenity-procedural = { path = "crates/procedural" }
axcenity-project = { path = "crates/project" }
axcenity-render = { path = "crates/render" }
axcenity-render-types = { path = "crates/render-types" }
axcenity-save = { path = "crates/save" }
axcenity-scene = { path = "crates/scene" }
axcenity-script = { path = "crates/script" }
axcenity-sim = { path = "crates/sim" }
axcenity-terrain = { path = "crates/terrain" }
axcenity-testing = { path = "crates/testing" }
axcenity-ui = { path = "crates/ui" }
# Generated by cargo-hakari; every engine crate depends on it. It turns on
# the same features of shared libraries whichever crates a command builds, so
# `-p` builds reuse the workspace's. After changing dependencies, run
# `cargo hakari generate` (see docs/development.md).
axcenity-workspace-hack = { path = "crates/workspace-hack" }

# Third-party crates.
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
# The editor's app shell: egui plus its window and wgpu backend. `persistence`
# remembers the theme, recent projects and window layout between runs. 0.32 is the
# release built on wgpu 25 and winit 0.30, the versions `render` and `player`
# use; upgrade all three together. No glow (OpenGL) backend: we render with wgpu.
eframe = { version = "0.32", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wayland", "wgpu", "x11"] }
env_logger = "0.11"
# Game controllers for keyboard-and-controller UI navigation, in the player
# and editor Play (Apache-2.0 OR MIT). Windows uses Windows.Gaming.Input,
# macOS IOKit, and Linux evdev through libudev (`libudev-dev` to build).
gilrs = "0.11"
# Event-based file watching for `project::Watcher` (roadmap I10): inotify,
# FSEvents and ReadDirectoryChangesW. CC0-1.0 (public domain dedication, no
# patent grant), compatible with Apache-2.0. The watcher falls back to its own
# polling where events can't be had.
notify = "8.2"
# Phosphor icons as a font, for the editor (MIT OR Apache-2.0; the icons are MIT).
# 0.10 is the release for egui 0.32: upgrade it with eframe.
egui-phosphor = { version = "0.10", default-features = false, features = ["fill", "regular"] }
# Dockable, draggable editor panels (tabs, splits and floating windows), MIT.
# 0.17 is the release for egui 0.32: upgrade it with eframe. `serde` saves the
# layout between runs.
egui_dock = { version = "0.17", features = ["serde"] }
glam = "0.34"
glyphon = "0.9"
# Loads glTF 2.0 models (.gltf and .glb), MIT OR Apache-2.0. The default
# `import` feature reads buffers and decodes PNG and JPEG textures with the
# `image` crate (MIT OR Apache-2.0), which eframe already uses.
# `KHR_texture_transform` reads textures' tiling, offset and rotation.
gltf = { version = "1.4", features = ["KHR_texture_transform", "extras"] }
# Decodes FBX models' textures. The same release `gltf` uses; the decoders are
# pure Rust (MIT OR Apache-2.0). FBX files often use TGA or BMP textures.
image = { version = "0.25", default-features = false, features = ["bmp", "exr", "hdr", "jpeg", "png", "tga"] }
# BC7-encodes cooked textures (roadmap L2) with Intel's ISPC texture
# compressor, prebuilt for Windows, Linux and macOS on x86_64 and arm64 (MIT
# OR Apache-2.0). Editor only, through `axcenity-cook`: the player reads
# cooked files and never links it.
intel_tex_2 = "0.5"
kira = "0.12"
log = "0.4"
# Decodes the logo PNG for the player's window icon, and writes the editor's
# project thumbnails. (The editor gets PNG decoding through eframe.)
png = "0.18"
# Luau, compiled from source (the `luau0-src` crate, MIT) so no system Lua is
# needed on any OS. Building it needs a C++ compiler. `luau-jit` builds
# Luau's native code generator (x86-64 and AArch64; elsewhere scripts stay
# interpreted); only `--!native` scripts use it (roadmap L3).
mlua = { version = "0.12", features = ["luau", "luau-jit"] }
# Pins the Luau sources `mlua` builds. mlua-sys 0.13.0 reads bytecode up to
# version 11; luau0-src 0.22.1 (Luau 0.744) writes version 13, so mlua takes
# every compiled chunk for source text and can't load it. Raise this only
# together with `mlua`; `crates/script/src/luau_pin_tests.rs` fails if the
# two stop matching.
luau0-src = "=0.22.0"
# The process's memory use for the editor's profiler, on Windows, macOS and
# Linux (MIT OR Apache-2.0).
memory-stats = "1.2"
# Math types Kira's spatial listener and emitters take (MIT OR Apache-2.0).
mint = "0.5"
pollster = "0.4"
# Profiler spans (roadmap I1): `profiling::scope!` and `finish_frame!` cost
# nothing unless a host's `profile-tracy` feature picks a backend
# (MIT OR Apache-2.0; already in the tree through wgpu, egui and rapier).
profiling = { version = "1", default-features = false }
# Native file and folder dialogs for the editor (Windows, macOS, and the
# desktop portal on Linux).
rfd = "0.17"
# Loads FBX models (binary and ASCII, every version), MIT OR Unlicense. Wraps the
# `ufbx` C library, compiled from source with `cc` like Lua, so nothing is needed on
# any OS beyond the C compiler `mlua` already uses.
ufbx = "0.11"
# Simplifies imported models' meshes into levels of detail (graphics Phase 13),
# MIT OR Apache-2.0. Wraps the `meshoptimizer` C++ library (MIT), compiled from
# source with `cc`, so it needs the C++ compiler `mlua` already uses.
meshopt = "0.7"
# The multiplayer transport (Phase 63), MIT OR Apache-2.0: reliable-ordered
# and unreliable channels (`renet`) over UDP, with netcode's connection
# handshake, timeouts and disconnect reasons (`renet_netcode`, over
# `renetcode`, which brings `chacha20poly1305`, MIT OR Apache-2.0). Pure
# Rust, on every OS. Upgrade the two together.
renet = "2"
renet_netcode = "2"
# The multiplayer wire (roadmap M7), MIT OR Apache-2.0: reliable messages,
# snapshots and RemoteEvent payloads as compact binary serde instead of
# JSON. Only `use-std`, which brings `cobs` (MIT OR Apache-2.0); not its
# default `heapless` support, which nothing here uses.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# Spreads a frame's draw planning over the CPU's threads (MIT OR Apache-2.0).
rayon = "1.10"
# A quicker hash than std's for the renderer's per-frame maps, whose keys
# are its own (MIT OR Apache-2.0); already in the tree through wgpu.
rustc-hash = "2"
# Physics. Its math types come from `glamx` (glam-based), re-exported as `rapier3d::math`.
rapier3d = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Find in Scripts' regex option (MIT OR Apache-2.0); already in the tree through env_logger.
regex = "1"
# Reads zip archives (ambientCG texture downloads). Deflate only: that is
# the method those archives use. MIT.
zip = { version = "2", default-features = false, features = ["deflate"] }
# HTTPS for the editor's texture catalog. rustls so no system TLS library
# is required. MIT OR Apache-2.0.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Hot-patching the running editor's code (unified Phase 26), only behind the
# editor's dev `hot-patch` feature; the player never has them. `subsecond`
# swaps in changed functions, `dioxus-devtools` connects to the `dx` CLI that
# builds the patches and applies them, and `dioxus-cli-config` says whether dx
# started the editor. All MIT OR Apache-2.0 (their dependencies add MIT and
# Zlib). dx 0.7.10 or later patches workspace crates, not only the editor's.
dioxus-cli-config = "0.7"
dioxus-devtools = "0.7"
subsecond = "0.7"
thiserror = "2"
taffy = { version = "0.7", features = ["taffy_tree"] }
wgpu = "25"
winit = "0.30"

[workspace.lints.rust]
# `deny`, not `forbid`, for one allowed block: the editor debugger reading a
# paused script's locals (`crates/script/src/debugger.rs`, v2 Phase 4).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds (`cargo run`) still optimize the libraries the engine uses,
# such as image decoding, physics and wgpu: unoptimized, one 4K JPEG takes
# about 4 s to decode instead of 0.2 s. The engine's own crates stay quick to
# rebuild, except the ones below, such as `render`, whose mipmap and terrain
# loops run on every new texture (1.2 s for a 4K map unoptimized, 25 ms
# optimized). Libraries are rebuilt once after this changes. Libraries keep
# only line tables (file and line in panics and backtraces, no local
# variables): full debug info doubled the editor binary to 1 GB and made
# every link and build slower.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package.axcenity-render]
opt-level = 3

# `scene` builds the draw list and `physics` steps the game every frame:
# in a big project, 13 ms against 5 ms and 6.6 ms against 0.9 ms unoptimized.
# `terrain` samples heights under both.
[profile.dev.package.axcenity-scene]
opt-level = 3

[profile.dev.package.axcenity-physics]
opt-level = 3

[profile.dev.package.axcenity-terrain]
opt-level = 3

# Building the navigation mesh walks every column of the world: 0.3 s for a
# 512-stud terrain unoptimized, 50 ms optimized.
[profile.dev.package.axcenity-nav]
opt-level = 3

# Generating a Fracture's pieces cuts the mesh hundreds of times: about 10
# times faster optimized.
[profile.dev.package.axcenity-mesh-edit]
opt-level = 3

# Release builds (`cargo build --release`, and the editor's
# `bench_project_play`): thin LTO lets the engine's crates inline across one
# another, and line tables keep file and line in panics and backtraces.
# `panic` stays "unwind" (the default) in every profile: asset loaders and
# editor Play catch panics with `catch_unwind`, which "abort" would break.
[profile.release]
lto = "thin"
debug = "line-tables-only"
panic = "unwind"

# What `release.yml` ships (`cargo build --profile dist`): whole-program LTO
# and one codegen unit for the fastest binaries, at the cost of a much longer
# build. Debug info is stripped; symbol names stay for backtraces.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
